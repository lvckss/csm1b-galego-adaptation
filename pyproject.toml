[project]
name = "csm1b-galego-adaptation"
version = "0.1.0"
description = "Adaptación de Sesame CSM-1B al gallego"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate",
    "datasets",
    "huggingface-hub",
    "jiwer",
    "librosa",
    "marimo",
    "matplotlib",
    "numpy",
    "pandas",
    "peft",
    "safetensors",
    "scipy",
    "soundfile",
    "tensorboard",
    "tqdm",
    "transformers>=4.52.1",
]

[project.optional-dependencies]
cpu = ["torch==2.8.0", "torchaudio==2.8.0"]
cuda = ["torch==2.8.0", "torchaudio==2.8.0"]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda" },
]
torchaudio = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu126", extra = "cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
